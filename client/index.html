<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>28 Royal Bihar</title>
    <!-- Tailwind CSS CDN for instant rendering in Cloud Shell -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 60%, #020617 100%);
        color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .casino-felt-table {
        background: radial-gradient(ellipse at center, #065f46 0%, #044332 50%, #022c22 85%, #011913 100%) !important;
        border: 8px solid #1c1917 !important;
        outline: 2px solid #ca8a04 !important;
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.85), 0 25px 50px -12px rgba(0, 0, 0, 0.8) !important;
      }
      .gold-glass {
        background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.95) 100%) !important;
        border: 1px solid rgba(234, 179, 8, 0.35) !important;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5) !important;
        backdrop-filter: blur(14px);
      }
      .casino-card {
        background: linear-gradient(145deg, #ffffff 0%, #f8fafc 60%, #e2e8f0 100%) !important;
        border-radius: 10px !important;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.9) !important;
        transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease !important;
        user-select: none;
      }
      .casino-card:hover:not(:disabled) {
        transform: translateY(-12px) scale(1.06) !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6), 0 0 18px rgba(250, 204, 21, 0.5) !important;
        z-index: 40;
      }
      @keyframes goldGlow {
        0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.7); border-color: #facc15; }
        50% { box-shadow: 0 0 30px rgba(234, 179, 8, 1); border-color: #fef08a; }
      }
      .active-turn-pulse {
        animation: goldGlow 1.5s infinite ease-in-out !important;
      }
    </style>
  </head>
  <body class="min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
